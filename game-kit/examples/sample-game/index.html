<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>토끼의 당근 피하기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #fdf3e1;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #4a3422;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 8px;
    gap: 6px;
  }

  /* 점수·목숨 */
  #hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 3px solid #f0a35e;
    border-radius: 14px;
    padding: 6px 12px;
    flex: none;
  }
  #scoreBox { font-size: 26px; font-weight: 800; }
  #scoreBox small { font-size: 15px; font-weight: 600; color: #a07a5a; }
  #lives { display: flex; gap: 4px; padding-top: 6px; }
  .heart {
    position: relative;
    width: 16px; height: 16px;
    margin: 0 6px 4px;
    background: #ff4d6d;
    transform: rotate(-45deg);
  }
  .heart::before, .heart::after {
    content: "";
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: inherit;
  }
  .heart::before { top: -8px; left: 0; }
  .heart::after { left: 8px; top: 0; }
  .heart.lost { background: #ddd2c4; }

  /* 게임 화면 */
  #stage {
    position: relative;
    flex: none;
    width: min(100%, calc((100vh - 150px) * 0.75));
    width: min(100%, calc((100dvh - 150px) * 0.75));
    aspect-ratio: 3 / 4;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    border: 3px solid #f0a35e;
    background: #bfe6ff;
    touch-action: none;
    cursor: grab;
  }

  /* 아래 버튼 */
  #controls {
    width: 100%;
    display: flex;
    gap: 8px;
    flex: none;
  }
  #controls button {
    height: 58px;
    border: none;
    border-radius: 14px;
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    background: #f08a3c;
    box-shadow: 0 4px 0 #c96a22;
    touch-action: none;
    cursor: pointer;
  }
  #controls button:active, #controls button.pressed {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #c96a22;
  }
  #leftBtn, #rightBtn { flex: 1; }
  #musicBtn {
    flex: none;
    width: 84px;
    font-size: 15px !important;
    background: #7cb342 !important;
    box-shadow: 0 4px 0 #558b2f !important;
  }
  #musicBtn.off { background: #a0a0a0 !important; box-shadow: 0 4px 0 #777 !important; }

  /* 겹치는 화면들 */
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    text-align: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .bigBtn {
    border: none;
    border-radius: 16px;
    padding: 14px 40px;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    background: #f08a3c;
    box-shadow: 0 5px 0 #c96a22;
    cursor: pointer;
  }
  .bigBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c96a22; }

  #startScreen {
    position: fixed;
    background: #fdf3e1;
    z-index: 20;
  }
  #poster {
    max-width: 100%;
    max-height: calc(100vh - 140px);
    max-height: calc(100dvh - 140px);
    object-fit: contain;
    border-radius: 16px;
  }
  #posterFallback { display: none; }
  #posterFallback h1 { font-size: 34px; margin-bottom: 8px; }
  #posterFallback p { font-size: 17px; line-height: 1.6; }

  #overScreen { background: rgba(60, 35, 20, 0.75); border-radius: 14px; color: #fff; }
  #overScreen h2 { font-size: 36px; }
  #overScreen p { font-size: 20px; }

  #clearScreen {
    position: fixed;
    background: #000;
    z-index: 30;
    padding: 0;
  }
  #ending {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  #clearMsg {
    position: relative;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    color: #fff;
  }
  #clearMsg.show { display: flex; }
  #clearMsg h2 { font-size: 38px; }
  #clearMsg p { font-size: 20px; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="scoreBox">점수 <span id="score">0</span> <small>/ 300</small></div>
    <div id="lives"></div>
  </div>

  <div id="stage">
    <canvas id="game" width="360" height="480"></canvas>

    <div id="overScreen" class="overlay">
      <h2>게임 오버</h2>
      <p>점수 <span id="overScore">0</span>점</p>
      <button class="bigBtn" id="overRetry">다시 하기</button>
    </div>
  </div>

  <div id="controls">
    <button id="leftBtn" aria-label="왼쪽">◀</button>
    <button id="musicBtn">음악 켬</button>
    <button id="rightBtn" aria-label="오른쪽">▶</button>
  </div>
</div>

<!-- 시작 화면 -->
<div id="startScreen" class="overlay show">
  <img id="poster" src="poster.png" alt="게임 포스터">
  <div id="posterFallback">
    <h1>토끼의 당근 피하기</h1>
    <p>떨어지는 당근을 피해 300점을 모아요!<br>← → 키, 아래 버튼, 화면 끌기로 움직여요.</p>
  </div>
  <button class="bigBtn" id="startBtn">시작</button>
</div>

<!-- 클리어 화면 (엔딩 영상) -->
<div id="clearScreen" class="overlay">
  <video id="ending" src="ending.mp4" playsinline preload="auto"></video>
  <div id="clearMsg">
    <h2>클리어!</h2>
    <p>당근을 모두 피했어요</p>
    <button class="bigBtn" id="clearRetry">다시 하기</button>
  </div>
</div>

<audio id="music" src="music.mp3" loop preload="auto"></audio>

<script>
(() => {
  // ===== 설정 (쉬운 난이도) =====
  const W = 360, H = 480;
  const GOAL = 300;            // 클리어 점수
  const POINTS_PER_SEC = 20;   // 1초에 20점
  const MAX_LIVES = 5;
  const INVINCIBLE_TIME = 1.5; // 부딪힌 뒤 무적 시간(초)
  const RABBIT_SPEED = 300;    // 키보드·버튼 이동 속도
  const DRAG_SPEED = 700;      // 끌기 따라가는 최대 속도
  const GROUND_Y = H - 28;

  // 점수가 오를수록 빨라지기: 0점 → 300점에서 아래 값 사이로 변해요
  const FALL_MIN = 110, FALL_MAX = 210;     // 당근 떨어지는 속도(px/초)
  const SPAWN_MIN = 0.65, SPAWN_MAX = 1.1;  // 당근 나오는 간격(초)

  // ===== 요소 =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const overScore = document.getElementById('overScore');
  const clearScreen = document.getElementById('clearScreen');
  const clearMsg = document.getElementById('clearMsg');
  const poster = document.getElementById('poster');
  const posterFallback = document.getElementById('posterFallback');
  const music = document.getElementById('music');
  const ending = document.getElementById('ending');
  const musicBtn = document.getElementById('musicBtn');

  // ===== 미디어: 없거나 막히면 그 기능만 건너뛰기 =====
  function showPosterFallback() {
    poster.style.display = 'none';
    posterFallback.style.display = 'block';
  }
  poster.addEventListener('error', showPosterFallback);
  if (poster.complete && poster.naturalWidth === 0) showPosterFallback();

  let musicOn = true;
  let musicBroken = false;
  music.addEventListener('error', () => { musicBroken = true; });

  function playMusic() {
    if (!musicOn || musicBroken) return;
    try {
      const p = music.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }
  function stopMusic() {
    try { music.pause(); } catch (e) {}
  }
  function updateMusicBtn() {
    musicBtn.textContent = musicOn ? '음악 켬' : '음악 끔';
    musicBtn.classList.toggle('off', !musicOn);
  }
  musicBtn.addEventListener('click', () => {
    musicOn = !musicOn;
    updateMusicBtn();
    if (musicOn && state === 'play') playMusic(); else stopMusic();
  });

  let endingBroken = false;
  ending.addEventListener('error', () => {
    endingBroken = true;
    if (state === 'clear') showClearMsg();
  });
  ending.addEventListener('ended', showClearMsg);

  function showClearMsg() {
    ending.style.display = 'none';
    clearMsg.classList.add('show');
  }

  function playEnding() {
    clearMsg.classList.remove('show');
    if (endingBroken) { showClearMsg(); return; }
    ending.style.display = 'block';
    try {
      ending.muted = false;
      ending.currentTime = 0;
      const p = ending.play();
      if (p && p.catch) {
        p.catch(() => {
          // 소리 때문에 막혔을 수 있으니 음소거로 한 번 더 시도
          ending.muted = true;
          const p2 = ending.play();
          if (p2 && p2.catch) p2.catch(showClearMsg);
        });
      }
    } catch (e) {
      showClearMsg();
    }
  }

  // ===== 게임 상태 =====
  let state = 'start'; // start | play | over | clear
  let score, lives, invincible, carrots, spawnTimer, lastTime;
  const rabbit = { x: W / 2, w: 56, h: 60 };

  function buildLives() {
    livesEl.innerHTML = '';
    for (let i = 0; i < MAX_LIVES; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      livesEl.appendChild(h);
    }
  }
  function updateHud() {
    scoreEl.textContent = Math.floor(score);
    const hearts = livesEl.children;
    for (let i = 0; i < hearts.length; i++) {
      hearts[i].classList.toggle('lost', i >= lives);
    }
  }

  function resetGame() {
    score = 0;
    lives = MAX_LIVES;
    invincible = 0;
    carrots = [];
    spawnTimer = 0.8;
    rabbit.x = W / 2;
    dragTarget = null;
    updateHud();
  }

  function startGame() {
    resetGame();
    state = 'play';
    startScreen.classList.remove('show');
    overScreen.classList.remove('show');
    clearScreen.classList.remove('show');
    clearMsg.classList.remove('show');
    try { ending.pause(); } catch (e) {}
    playMusic();
  }

  function gameOver() {
    state = 'over';
    overScore.textContent = Math.floor(score);
    overScreen.classList.add('show');
  }

  function gameClear() {
    state = 'clear';
    score = GOAL;
    updateHud();
    stopMusic();
    clearScreen.classList.add('show');
    playEnding();
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('overRetry').addEventListener('click', startGame);
  document.getElementById('clearRetry').addEventListener('click', startGame);

  // ===== 조작 =====
  const keys = { left: false, right: false };
  const btnHold = { left: false, right: false };
  let dragTarget = null;

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { keys.left = true; dragTarget = null; e.preventDefault(); }
    if (e.key === 'ArrowRight') { keys.right = true; dragTarget = null; e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });
  window.addEventListener('blur', () => {
    keys.left = keys.right = btnHold.left = btnHold.right = false;
  });

  function bindHold(btn, dir) {
    const on = (e) => {
      e.preventDefault();
      btnHold[dir] = true;
      dragTarget = null;
      btn.classList.add('pressed');
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
    };
    const off = () => { btnHold[dir] = false; btn.classList.remove('pressed'); };
    btn.addEventListener('pointerdown', on);
    btn.addEventListener('pointerup', off);
    btn.addEventListener('pointercancel', off);
    btn.addEventListener('lostpointercapture', off);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  bindHold(document.getElementById('leftBtn'), 'left');
  bindHold(document.getElementById('rightBtn'), 'right');

  let dragging = false;
  function toGameX(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) / r.width * W;
  }
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    dragTarget = toGameX(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', (e) => {
    if (dragging) dragTarget = toGameX(e);
  });
  const endDrag = () => { dragging = false; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ===== 진행 =====
  function progress() { return Math.min(score / GOAL, 1); }

  function spawnCarrot() {
    const size = 0.9 + Math.random() * 0.3;
    carrots.push({
      x: 24 + Math.random() * (W - 48),
      y: -50,
      s: size,
      speed: (FALL_MIN + (FALL_MAX - FALL_MIN) * progress()) * (0.85 + Math.random() * 0.3),
      rot: (Math.random() - 0.5) * 0.4,
    });
  }

  function update(dt) {
    // 토끼 이동
    const dir = (keys.right || btnHold.right ? 1 : 0) - (keys.left || btnHold.left ? 1 : 0);
    if (dir !== 0) {
      rabbit.x += dir * RABBIT_SPEED * dt;
    } else if (dragTarget !== null) {
      const diff = dragTarget - rabbit.x;
      const step = DRAG_SPEED * dt;
      rabbit.x += Math.abs(diff) <= step ? diff : Math.sign(diff) * step;
    }
    const half = rabbit.w / 2;
    rabbit.x = Math.max(half, Math.min(W - half, rabbit.x));

    // 점수
    score += POINTS_PER_SEC * dt;
    if (score >= GOAL) { gameClear(); return; }

    // 당근 만들기
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnCarrot();
      spawnTimer = SPAWN_MAX - (SPAWN_MAX - SPAWN_MIN) * progress();
    }

    // 당근 이동
    for (const c of carrots) c.y += c.speed * dt;
    carrots = carrots.filter((c) => c.y < H + 60);

    // 부딪힘 판정 (그림보다 작게)
    if (invincible > 0) {
      invincible -= dt;
    } else {
      const rx = rabbit.x, ry = GROUND_Y - 24; // 토끼 몸통 중심
      const rr = 16;                            // 토끼 판정 반지름(그림 폭 56의 절반보다 작게)
      for (const c of carrots) {
        const cx = c.x, cy = c.y + 6 * c.s;     // 당근 몸통 중심
        const cr = 8 * c.s;                     // 당근 판정 반지름
        const dx = rx - cx, dy = ry - cy;
        if (dx * dx + dy * dy < (rr + cr) * (rr + cr)) {
          lives--;
          invincible = INVINCIBLE_TIME;
          c.y = H + 100; // 부딪힌 당근은 없애기
          updateHud();
          if (lives <= 0) { gameOver(); return; }
          break;
        }
      }
    }
    updateHud();
  }

  // ===== 그리기 =====
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#9fd8ff');
    g.addColorStop(1, '#e3f5ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 구름
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    [[60, 70], [250, 120], [150, 200]].forEach(([x, y]) => {
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.arc(x + 20, y - 8, 22, 0, Math.PI * 2);
      ctx.arc(x + 42, y, 17, 0, Math.PI * 2);
      ctx.fill();
    });

    // 땅
    ctx.fillStyle = '#7cc45a';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.fillStyle = '#5fa843';
    ctx.fillRect(0, GROUND_Y, W, 5);
  }

  function drawCarrot(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.scale(c.s, c.s);

    // 잎
    ctx.fillStyle = '#3fa34d';
    for (const a of [-0.5, 0, 0.5]) {
      ctx.save();
      ctx.translate(0, -16);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0, -9, 4, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // 몸통 (아래로 뾰족한 당근)
    ctx.fillStyle = '#ff8a1f';
    ctx.beginPath();
    ctx.moveTo(-12, -16);
    ctx.quadraticCurveTo(0, -22, 12, -16);
    ctx.lineTo(1.5, 28);
    ctx.quadraticCurveTo(0, 31, -1.5, 28);
    ctx.closePath();
    ctx.fill();
    // 줄무늬
    ctx.strokeStyle = '#d96a0b';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-8, -4); ctx.lineTo(-2, -3);
    ctx.moveTo(3, 6); ctx.lineTo(7, 5);
    ctx.moveTo(-5, 14); ctx.lineTo(-1, 14);
    ctx.stroke();
    ctx.restore();
  }

  function drawRabbit() {
    // 무적일 때 깜빡이기
    if (invincible > 0 && Math.floor(invincible * 10) % 2 === 0) return;

    const x = rabbit.x, base = GROUND_Y;
    ctx.save();
    ctx.translate(x, base);

    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(0, 2, 26, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#c9b8a8';
    ctx.lineWidth = 2;

    // 귀
    for (const sx of [-1, 1]) {
      ctx.save();
      ctx.translate(sx * 9, -46);
      ctx.rotate(sx * 0.18);
      ctx.beginPath();
      ctx.ellipse(0, -16, 7, 18, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(0, -15, 3.5, 12, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#ffb6c8';
      ctx.fill();
      ctx.restore();
    }

    // 몸통
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(0, -16, 24, 17, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 머리
    ctx.beginPath();
    ctx.arc(0, -38, 17, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 눈
    ctx.fillStyle = '#3a2a20';
    ctx.beginPath();
    ctx.arc(-6, -40, 2.6, 0, Math.PI * 2);
    ctx.arc(6, -40, 2.6, 0, Math.PI * 2);
    ctx.fill();
    // 볼
    ctx.fillStyle = 'rgba(255,140,170,0.5)';
    ctx.beginPath();
    ctx.arc(-11, -33, 3.5, 0, Math.PI * 2);
    ctx.arc(11, -33, 3.5, 0, Math.PI * 2);
    ctx.fill();
    // 코
    ctx.fillStyle = '#ff7f9f';
    ctx.beginPath();
    ctx.moveTo(-2.5, -35);
    ctx.lineTo(2.5, -35);
    ctx.lineTo(0, -32);
    ctx.closePath();
    ctx.fill();

    // 발
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(-12, -2, 8, 4, 0, 0, Math.PI * 2);
    ctx.ellipse(12, -2, 8, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function drawProgressBar() {
    const p = progress();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(10, 10, W - 20, 10);
    ctx.fillStyle = '#ff8a1f';
    ctx.fillRect(10, 10, (W - 20) * p, 10);
  }

  function draw() {
    drawBackground();
    for (const c of carrots) drawCarrot(c);
    drawRabbit();
    drawProgressBar();
  }

  // ===== 반복 =====
  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    if (state === 'play') update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  buildLives();
  resetGame();
  updateMusicBtn();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
