<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>상담 분류 도우미 v1.2</title>
<style>
  body { font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 13px; margin: 20px; color: #222; }
  h2 small { color: #888; font-weight: normal; font-size: 12px; }
  table.form th { text-align: right; padding: 4px 8px; width: 80px; vertical-align: top; }
  table.list { border-collapse: collapse; margin-top: 10px; width: 100%; }
  table.list th, table.list td { border: 1px solid #ccc; padding: 4px 6px; }
  table.list th { background: #eee; }
  tr.P1 td { background: #ffd6d6; }
  tr.P2 td { background: #ffecc7; }
  tr.P3 td { background: #fffbe0; }
  #stats { margin: 10px 0; padding: 6px; background: #f5f5f5; }
  #stats .late { color: red; }
  button { padding: 4px 12px; }
</style>
</head>
<body>
<h2>상담 분류 도우미 <small>v1.2 (2018.07) 문의: CS운영</small></h2>

<table class="form">
  <tr><th>제목</th><td><input id="title" size="70"></td></tr>
  <tr><th>내용</th><td><textarea id="body" rows="5" cols="70"></textarea></td></tr>
  <tr><th>고객 등급</th><td>
    <select id="grade">
      <option>일반</option>
      <option>우수</option>
      <option>VIP</option>
    </select>
  </td></tr>
  <tr><th>접수 채널</th><td>
    <label><input type="radio" name="channel" value="웹" checked> 웹</label>
    <label><input type="radio" name="channel" value="이메일"> 이메일</label>
    <label><input type="radio" name="channel" value="채팅"> 채팅</label>
    <label><input type="radio" name="channel" value="전화"> 전화</label>
  </td></tr>
  <tr><th>접수 시각</th><td><input id="received" type="datetime-local"> (비우면 지금 시각)</td></tr>
</table>

<p>
  <button onclick="onClassify()">분류</button>
  <button onclick="onSample()">예시 넣기</button>
  <button onclick="onDeleteLast()">마지막 줄 지우기</button>
  <button onclick="onCopy()">엑셀로 복사</button>
</p>

<div id="stats">아직 분류한 티켓이 없어요.</div>

<table class="list">
  <thead>
    <tr><th>#</th><th>제목</th><th>카테고리</th><th>긴급도</th><th>담당</th><th>접수</th><th>마감</th></tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<!-- <script src="jquery-1.12.4.min.js"></script> 안 씀 -->
<script src="app.js"></script>
</body>
</html>
