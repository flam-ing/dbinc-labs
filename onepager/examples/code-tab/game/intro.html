<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토끼 당근 피하기 - 인트로</title>
<style>
  html, body { margin: 0; height: 100%; background: #111a2b; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; }
</style>
</head>
<body>
<canvas id="cv" width="960" height="540" aria-label="토끼 당근 피하기 소개 영상"></canvas>
<script>
(function () {
  var W = 960, H = 540, GROUND = 440, DURATION = 10;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var start = performance.now();

  /* ---------- 이징 ---------- */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function prog(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
  function easeOutBack(x) { var c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

  /* ---------- 장면 요소 ---------- */
  var clouds = [{ x: 120, y: 90, s: 1 }, { x: 520, y: 60, s: 1.4 }, { x: 820, y: 130, s: .8 }];
  // 당근: 떨어지기 시작하는 시간, x좌표, 회전. 토끼가 지나간 뒤/앞 자리에 떨어져요.
  var carrots = [
    { t: 4.2, x: 700, r: .3 }, { t: 4.6, x: 880, r: -.4 }, { t: 5.0, x: 520, r: .2 },
    { t: 5.5, x: 300, r: -.2 }, { t: 5.9, x: 780, r: .4 }, { t: 6.3, x: 150, r: -.3 },
    { t: 6.8, x: 420, r: .25 }, { t: 7.2, x: 640, r: -.35 }, { t: 7.6, x: 60, r: .3 },
    { t: 8.0, x: 850, r: -.2 }, { t: 8.3, x: 260, r: .35 }, { t: 8.6, x: 560, r: -.3 }
  ];
  var dust = [];

  /* ---------- 그리기 ---------- */
  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.arc(x, y, 26 * s, 0, 7); ctx.arc(x + 28 * s, y - 10 * s, 32 * s, 0, 7);
    ctx.arc(x + 60 * s, y, 26 * s, 0, 7); ctx.fill();
    ctx.fillRect(x, y, 60 * s, 26 * s);
  }
  function drawCarrot(x, y, rot, sc) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
    ctx.fillStyle = '#3fae49';
    ctx.beginPath(); ctx.ellipse(-5, -24, 4, 10, -.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, -24, 4, 10, .5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -26, 4, 11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff8c1a';
    ctx.beginPath(); ctx.moveTo(-12, -16); ctx.quadraticCurveTo(0, -24, 12, -16); ctx.lineTo(0, 28); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#d96c00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(0, -8); ctx.moveTo(3, 2); ctx.lineTo(8, 2); ctx.moveTo(-3, 12); ctx.lineTo(1, 12); ctx.stroke();
    ctx.restore();
  }
  function drawRabbit(x, y, phase, sc) {
    // phase: 달리기 위상. 귀가 휘날리고 몸이 기울어요.
    var lean = .12, earSwing = Math.sin(phase * 2) * .25 + .5;
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate(lean);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#9aa6b8'; ctx.lineWidth = 2;
    // 다리
    ctx.fillStyle = '#fff';
    var l = Math.sin(phase) * 14;
    ctx.beginPath(); ctx.ellipse(-8 + l, 24, 10, 6, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(10 - l, 24, 10, 6, 0, 0, 7); ctx.fill(); ctx.stroke();
    // 꼬리
    ctx.beginPath(); ctx.arc(-20, 10, 7, 0, 7); ctx.fill(); ctx.stroke();
    // 귀 (뒤로 휘날림)
    [-9, 9].forEach(function (ex, i) {
      ctx.save(); ctx.translate(ex, -14); ctx.rotate(-earSwing - (i ? .1 : 0));
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, -16, 6, 16, 0, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffc2d1'; ctx.beginPath(); ctx.ellipse(0, -15, 3, 11, 0, 0, 7); ctx.fill();
      ctx.restore();
    });
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(0, 8, 20, 17, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -6, 16, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-4, -8, 2.5, 0, 7); ctx.arc(8, -8, 2.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff7f9c'; ctx.beginPath(); ctx.arc(13, -3, 2.5, 0, 7); ctx.fill();
    ctx.restore();
  }
  function textOutline(str, x, y, size, fill, stroke) {
    ctx.font = '900 ' + size + 'px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = size * .14;
    ctx.strokeStyle = stroke; ctx.strokeText(str, x, y);
    ctx.fillStyle = fill; ctx.fillText(str, x, y);
  }

  /* ---------- 프레임 ---------- */
  var lastT = 0;
  function frame(now) {
    var t = ((now - start) / 1000) % DURATION;
    if (t < lastT) dust = [];
    lastT = t;

    // 배경
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#bfe6ff'); g.addColorStop(1, '#e9f8d8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    clouds.forEach(function (c) { drawCloud(((c.x + t * 12 * c.s) % (W + 200)) - 100, c.y, c.s); });
    ctx.fillStyle = '#7ccf6a'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#69bd58'; ctx.fillRect(0, GROUND, W, 8);

    // 제목: 0.2~1.2초에 튀어나오고, 2.5~3.3초에 위로 올라가 작아져요
    var pop = easeOutBack(prog(t, .2, 1.2));
    var up = easeInOut(prog(t, 2.5, 3.3));
    var tx = W / 2, ty = H / 2 - 20 - up * (H / 2 - 20 - 85);
    var ts = pop * (1 - up * .45);
    // 튀어나올 때 살짝 흔들림
    var wob = t < 1.8 ? Math.sin(t * 22) * .03 * (1 - prog(t, .2, 1.8)) : 0;
    if (t > .2 && ts > 0) {
      ctx.save(); ctx.translate(tx, ty); ctx.rotate(wob); ctx.scale(ts, ts);
      textOutline('토끼', -150, -48, 120, '#fff', '#2b3a55');
      textOutline('당근 피하기', 0, 62, 120, '#ff8c1a', '#2b3a55');
      drawCarrot(235, -68, .5, 1.6);
      ctx.restore();
    }

    // 토끼: 2.8~7.2초에 화면 왼쪽에서 오른쪽으로 달려요
    var rp = prog(t, 2.8, 7.2);
    if (rp > 0 && rp < 1) {
      var rx = -60 + easeInOut(rp * .15 + rp * .85) * (W + 120);
      var phase = t * 16, hop = Math.abs(Math.sin(phase * .5)) * 26;
      // 먼지
      if (Math.random() < .5) dust.push({ x: rx - 30, y: GROUND + 4, life: 1 });
      drawRabbit(rx, GROUND - 38 - hop, phase, 1.5);
      // 그림자
      ctx.fillStyle = 'rgba(0,0,0,.12)';
      ctx.beginPath(); ctx.ellipse(rx, GROUND + 12, 34 - hop * .4, 7, 0, 0, 7); ctx.fill();
    }
    dust.forEach(function (d) {
      d.life -= .03; d.y -= .4; d.x -= 1.2;
      ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, d.life * .7) + ')';
      ctx.beginPath(); ctx.arc(d.x, d.y, 8 * (1.2 - d.life) + 3, 0, 7); ctx.fill();
    });
    dust = dust.filter(function (d) { return d.life > 0; });

    // 당근: 위에서 떨어져 땅에 튕기고 박혀요
    carrots.forEach(function (c) {
      var dt = t - c.t;
      if (dt < 0) return;
      var fallTime = .9, y;
      if (dt < fallTime) y = -50 + (GROUND - 10 + 50) * (dt * dt) / (fallTime * fallTime);
      else {
        var b = dt - fallTime, bounce = Math.abs(Math.sin(b * 9)) * 30 * Math.exp(-b * 5);
        y = GROUND - 10 - bounce;
      }
      var fade = t > 9.6 ? 1 - prog(t, 9.6, 10) : 1;
      ctx.globalAlpha = fade;
      drawCarrot(c.x, y, c.r + (dt < fallTime ? dt * 2 : 0), 1.2);
      ctx.globalAlpha = 1;
    });

    // '지금 플레이': 8.2초부터 등장, 깜빡임
    if (t >= 8.2) {
      var a = prog(t, 8.2, 8.5);
      var blink = Math.sin((t - 8.2) * Math.PI * 4) > -.2 ? 1 : .15; // 약 0.5초 주기
      var bw = 380, bh = 92, bx = W / 2, by = 290;
      ctx.save(); ctx.globalAlpha = a * blink;
      ctx.translate(bx, by); ctx.scale(.9 + .1 * a, .9 + .1 * a);
      ctx.fillStyle = '#2b3a55';
      ctx.beginPath(); ctx.roundRect(-bw / 2 + 4, -bh / 2 + 8, bw, bh, 28); ctx.fill();
      ctx.fillStyle = '#ff8c1a';
      ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 28); ctx.fill();
      textOutline('▶ 지금 플레이', 0, 2, 52, '#fff', '#b85a00');
      ctx.restore();
    }

    // 페이드 인/아웃
    var fo = Math.max(1 - prog(t, 0, .25), prog(t, 9.75, 10));
    if (fo > 0) { ctx.fillStyle = 'rgba(17,26,43,' + fo + ')'; ctx.fillRect(0, 0, W, H); }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  cv.addEventListener('click', function () { start = performance.now(); dust = []; });
})();
</script>
</body>
</html>
