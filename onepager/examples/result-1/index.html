<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토끼 당근 피하기</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --sky: #5ec8ff; --sky-2: #9be3ff; --ink: #1f2430; --muted: #4a5568; --orange: #ff6f0f;
    --yellow: #ffe033; --white: #ffffff; --line: #1f2430;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #ffe9a8; color: var(--ink); font-family: "Courier New", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", monospace; font-weight: 700; }
  body { display: flex; justify-content: center; }
  .app { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 8px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -.02em; text-shadow: 2px 2px 0 var(--yellow); }
  .score { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  .score small { font-size: 14px; color: var(--muted); font-weight: 700; margin-left: 2px; }
  .lives { display: flex; gap: 4px; }
  .lives i { width: 16px; height: 16px; background: var(--orange); display: block; border: 2px solid var(--line); }
  .lives i.off { background: #cfd5df; }
  button { font: inherit; cursor: pointer; }
  .sound { border: 3px solid var(--line); background: var(--white); padding: 5px 12px; font-size: 14px; font-weight: 800; box-shadow: 3px 3px 0 var(--line); }
  .sound:disabled { color: #8a93a3; cursor: default; box-shadow: none; }
  .stage { position: relative; flex: 1; min-height: 280px; overflow: hidden; background: var(--sky); border: 4px solid var(--line); box-shadow: 6px 6px 0 var(--line); touch-action: none; user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px; background: rgba(255, 255, 255, .85); }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 34px; letter-spacing: -.03em; text-shadow: 3px 3px 0 var(--yellow); }
  .overlay p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; }
  .overlay .big { font-size: 22px; font-weight: 800; color: var(--ink); }
  .start-screen { background: var(--sky); }
  .start-screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; background: var(--sky); }
  .start-screen .card { position: relative; margin-top: auto; margin-bottom: 10px; background: #fff; border: 4px solid var(--line); box-shadow: 5px 5px 0 var(--line); padding: 12px 22px; }
  .start-screen .card h2 { font-size: 26px; }
  .start-screen.no-poster .card { margin-top: 0; }
  .primary { border: 4px solid var(--line); background: var(--orange); color: #fff; font-size: 22px; font-weight: 800; padding: 10px 34px; box-shadow: 5px 5px 0 var(--line); text-shadow: 2px 2px 0 var(--line); }
  .primary:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--line); }
  .clear-screen { background: #2b2f8f; color: #fff; }
  .clear-screen h2 { text-shadow: 3px 3px 0 #000; color: var(--yellow); }
  .clear-screen p { color: #fff; }
  .clear-screen canvas.ending { position: static; width: min(100%, 560px); height: auto; aspect-ratio: 16 / 9; max-height: 55%; image-rendering: pixelated; border: 4px solid #fff; background: var(--sky); }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .controls button { height: 64px; border: 4px solid var(--line); background: var(--white); box-shadow: 4px 4px 0 var(--line); display: flex; align-items: center; justify-content: center; }
  .controls button.on { background: var(--yellow); transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--line); }
  .controls svg { width: 28px; height: 28px; fill: var(--ink); }
  .status { font-size: 13px; color: var(--muted); text-align: center; }
  @media (max-width: 480px) {
    .top { gap: 8px; }
    .top h1 { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .lives i { width: 12px; height: 12px; }
    .score { font-size: 22px; min-width: 0; }
    .sound { padding: 4px 8px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>토끼 당근 피하기</h1>
    <div class="lives" id="lives" aria-label="목숨"></div>
    <div class="score" aria-live="polite"><span id="score">0</span><small>/ 300점</small></div>
    <button class="sound" id="sound" type="button" disabled>음악 없음</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" aria-label="게임 화면. 왼쪽 오른쪽 화살표 키나 아래 버튼, 끌기로 토끼를 움직여요."></canvas>

    <div class="overlay start-screen" id="start">
      <img id="poster" alt="게임 포스터" hidden>
      <div class="card">
        <h2>토끼 당근 피하기</h2>
        <p>떨어지는 당근을 피해서 300점을 모아요.<br>키보드 ←→, 아래 버튼, 끌기로 움직여요.</p>
        <p><button class="primary" id="play" type="button">시작</button></p>
      </div>
    </div>

    <div class="overlay" id="over" hidden>
      <h2>게임 오버</h2>
      <p class="big" id="over-score">0점</p>
      <p>당근에 다섯 번 부딪혔어요.</p>
      <button class="primary" id="again" type="button">다시 하기</button>
    </div>

    <div class="overlay clear-screen" id="clear" hidden>
      <h2>축하해요! 클리어</h2>
      <canvas id="ending" class="ending" width="160" height="90" aria-label="엔딩 영상: 토끼가 당근을 안고 폭죽 속에서 뛰어요"></canvas>
      <p id="clear-note">300점을 모았어요. 당근을 다 피했어요!</p>
      <button class="primary" id="again2" type="button">다시 하기</button>
    </div>
  </div>

  <div class="controls">
    <button type="button" id="left" aria-label="왼쪽으로"><svg viewBox="0 0 24 24"><path d="M16 4 L6 12 L16 20 Z"/></svg></button>
    <button type="button" id="right" aria-label="오른쪽으로"><svg viewBox="0 0 24 24"><path d="M8 4 L18 12 L8 20 Z"/></svg></button>
  </div>
  <p class="status" id="media-status">포스터 확인 중 · 음악 확인 중</p>
</div>

<script>
// 미디어 파일: assets 폴더의 두 파일을 찾아요. 없으면 그 기능만 건너뛰어요.
// 엔딩 영상은 파일이 아니라 아래 drawEnding()이 브라우저에서 직접 그려요.
const MEDIA = { poster: 'assets/poster.png', music: 'assets/music.wav' };

// 게임 규칙
const RULES = {
  goal: 300,            // 300점이면 클리어
  pointsPerSecond: 20,  // 1초에 20점
  lives: 5,             // 목숨 5개
  invincibleMs: 1500,   // 부딪히면 1.5초 동안 무적
  fallSpeed: [150, 230],// 당근이 떨어지는 속도(화면 높이 600 기준, 1초에 움직이는 거리)
  spawnMs: 900          // 당근이 새로 생기는 간격
};

const $ = (id) => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d');
const stage = $('stage');
const status = { poster: '확인 중', music: '확인 중' };
const LABEL = { poster: '포스터', music: '음악' };

let W = 0, H = 0, scale = 1;
let state = 'start';  // start, play, over, clear
let rabbit, carrots, score, lives, hitUntil, lastSpawn, lastTime, keys, dragX;
let musicOn = true;
let music = null;

function showStatus() {
  $('media-status').textContent = Object.keys(status).map((k) => `${LABEL[k]} ${status[k]}`).join(' · ');
}

// ---------- 미디어 불러오기 (없어도 오류 없이 넘어가요) ----------
function loadPoster() {
  const img = $('poster');
  img.addEventListener('load', () => { status.poster = '있음'; img.hidden = false; showStatus(); });
  img.addEventListener('error', () => { status.poster = '없음'; $('start').classList.add('no-poster'); showStatus(); });
  img.src = MEDIA.poster;
}

function loadMusic() {
  try {
    const audio = new Audio();
    audio.loop = true;
    audio.preload = 'auto';
    audio.volume = 0.5;
    audio.addEventListener('canplaythrough', () => {
      if (status.music === '있음') return;
      status.music = '있음';
      music = audio;
      $('sound').disabled = false;
      $('sound').textContent = musicOn ? '음악 끄기' : '음악 켜기';
      showStatus();
    });
    audio.addEventListener('error', () => { status.music = '없음'; music = null; showStatus(); });
    audio.src = MEDIA.music;
    audio.load();
  } catch (e) {
    status.music = '없음';
    showStatus();
  }
}

function playMusic() {
  if (!music || !musicOn) return;
  const p = music.play();
  if (p && p.catch) p.catch(() => { /* 브라우저가 소리를 막으면 조용히 넘어가요 */ });
}

function stopMusic() {
  if (music) music.pause();
}

$('sound').addEventListener('click', () => {
  musicOn = !musicOn;
  $('sound').textContent = musicOn ? '음악 끄기' : '음악 켜기';
  if (musicOn && state === 'play') playMusic(); else stopMusic();
});

// ---------- 화면 크기 ----------
function resize() {
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = H / 600;
  if (rabbit) rabbit.y = H - 70 * scale;
  draw();
}
window.addEventListener('resize', resize);

// ---------- 게임 ----------
function reset() {
  rabbit = { x: W / 2, y: H - 70 * scale, speed: 520 };
  carrots = [];
  score = 0;
  lives = RULES.lives;
  hitUntil = 0;
  lastSpawn = 0;
  keys = { left: false, right: false };
  dragX = null;
  updateHud();
}

function start() {
  reset();
  state = 'play';
  cancelAnimationFrame(endingRaf);
  ['start', 'over', 'clear'].forEach((id) => { $(id).hidden = true; });
  if (music) music.currentTime = 0;
  playMusic();
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function updateHud() {
  $('score').textContent = Math.floor(score);
  $('lives').innerHTML = Array.from({ length: RULES.lives }, (_, i) => `<i class="${i < lives ? '' : 'off'}"></i>`).join('');
}

function spawn(now) {
  const size = (34 + Math.random() * 10) * scale;
  const [lo, hi] = RULES.fallSpeed;
  carrots.push({ x: size + Math.random() * (W - size * 2), y: -size, size, speed: (lo + Math.random() * (hi - lo)) * scale, tilt: (Math.random() - 0.5) * 0.6 });
  lastSpawn = now;
}

function loop(now) {
  if (state !== 'play') return;
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  // 움직이기
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dragX != null) rabbit.x += (dragX - rabbit.x) * Math.min(1, dt * 14);
  else rabbit.x += dir * rabbit.speed * scale * dt;
  const half = 34 * scale;
  rabbit.x = Math.max(half, Math.min(W - half, rabbit.x));

  // 당근
  if (now - lastSpawn > RULES.spawnMs) spawn(now);
  carrots.forEach((c) => { c.y += c.speed * dt; });
  carrots = carrots.filter((c) => c.y < H + c.size);

  // 부딪힘: 판정은 그림보다 작게 잡아서 너그럽게
  if (now > hitUntil) {
    for (const c of carrots) {
      const dx = c.x - rabbit.x, dy = c.y - (rabbit.y - 10 * scale);
      if (Math.abs(dx) < 26 * scale && Math.abs(dy) < 34 * scale) {
        lives -= 1;
        hitUntil = now + RULES.invincibleMs;
        c.y = H + 999;
        updateHud();
        if (lives <= 0) { endGame('over'); return; }
        break;
      }
    }
  }

  // 점수
  score += RULES.pointsPerSecond * dt;
  if (score >= RULES.goal) { score = RULES.goal; updateHud(); endGame('clear'); return; }
  $('score').textContent = Math.floor(score);

  draw(now);
  requestAnimationFrame(loop);
}

function endGame(kind) {
  state = kind;
  stopMusic();
  draw();
  if (kind === 'over') {
    $('over-score').textContent = Math.floor(score) + '점';
    $('over').hidden = false;
    return;
  }
  $('clear').hidden = false;
  startEnding();
}

// ---------- 그리기 (도트 스프라이트) ----------
const PAL = { W: '#ffffff', P: '#ff96aa', K: '#1f2430', N: '#ff6f0f', L: '#2dbe50', O: '#ff7a1a', o: '#c85000' };
const RABBIT_ART = [
  '..WW....WW..', '.WPW....WPW.', '.WPW....WPW.', '.WPW....WPW.', '.WWWWWWWWWW.', 'WWWWWWWWWWWW',
  'WWKWWWWWWKWW', 'WWWWWWWWWWWW', 'WPPWWNNWWPPW', '.WWWWWWWWWW.', '..WWWWWWWW..', '.WWWWWWWWWW.',
  'WWWWWWWWWWWW', 'WWWWWWWWWWWW', '.WWW....WWW.'
];
const CARROT_ART = ['.L.L.L.', '..LLL..', '.OOOOO.', '.OOOOO.', '.OOoOO.', '..OOO..', '..OoO..', '...O...', '...O...'];

function makeSprite(art) {
  const c = document.createElement('canvas');
  c.width = art[0].length; c.height = art.length;
  const g = c.getContext('2d');
  art.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch !== '.') { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); }
  }));
  return c;
}
const SPR = { rabbit: makeSprite(RABBIT_ART), carrot: makeSprite(CARROT_ART) };

function blit(g, spr, x, y, cell) {
  g.imageSmoothingEnabled = false;
  g.drawImage(spr, Math.round(x), Math.round(y), spr.width * cell, spr.height * cell);
}

function draw(now = performance.now()) {
  if (!W) return;
  ctx.clearRect(0, 0, W, H);
  const px = Math.max(4, Math.round(8 * scale));  // 배경 도트 크기
  // 하늘 띠
  ctx.fillStyle = '#9be3ff'; ctx.fillRect(0, H * 0.45, W, H);
  // 해 (네모난 도트 원)
  ctx.fillStyle = '#ffe033';
  for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
    if (dx * dx + dy * dy <= 10) ctx.fillRect(W - 70 * scale + dx * px, 80 * scale + dy * px, px, px);
  }
  // 구름
  ctx.fillStyle = '#ffffff';
  [[0.12, 0.14], [0.55, 0.28]].forEach(([fx, fy]) => {
    const x = W * fx, y = H * fy;
    ctx.fillRect(x, y + px, px * 7, px * 2); ctx.fillRect(x + px, y, px * 4, px); ctx.fillRect(x + px * 2, y - px, px * 2, px);
  });
  // 계단식 풀밭
  const base = H - 40 * scale;
  ctx.fillStyle = '#24a84a';
  for (let x = 0; x < W; x += px * 2) ctx.fillRect(x, base - px * (1 + Math.abs(((x / (px * 2)) * 7) % 5 - 2)), px * 2, H);
  ctx.fillStyle = '#3ccf5a'; ctx.fillRect(0, base, W, H);
  ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0, H - 14 * scale, W, 14 * scale);
  if (!rabbit) return;
  (carrots || []).forEach((c) => blit(ctx, SPR.carrot, c.x - SPR.carrot.width * c.size * 0.065, c.y - SPR.carrot.height * c.size * 0.065, c.size * 0.13));
  const blink = now < hitUntil && Math.floor(now / 120) % 2 === 0;
  if (!blink) blit(ctx, SPR.rabbit, rabbit.x - SPR.rabbit.width * 3 * scale, rabbit.y - 44 * scale, 6 * scale);
}

// ---------- 엔딩 영상 (브라우저에서 직접 그려요) ----------
const ec = $('ending');
const ectx = ec.getContext('2d');
let endingRaf = 0, endingStart = 0, audioCtx = null;

function jingle() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
    notes.forEach((f, i) => {
      if (!musicOn) return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + i * 0.14;
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + (i === 6 ? 0.7 : 0.13));
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.75);
    });
  } catch (e) { /* 소리가 안 나도 그림은 나와요 */ }
}

function drawEnding(t) {
  const g = ectx;
  g.imageSmoothingEnabled = false;
  g.fillStyle = Math.floor(t * 2) % 2 ? '#5ec8ff' : '#6fd0ff'; g.fillRect(0, 0, 160, 90);
  g.fillStyle = '#9be3ff'; g.fillRect(0, 40, 160, 50);
  // 흐르는 구름
  g.fillStyle = '#fff';
  for (let i = 0; i < 3; i++) {
    const x = ((i * 70 - t * 12) % 200 + 200) % 200 - 30, y = 10 + i * 14;
    g.fillRect(x, y + 3, 22, 5); g.fillRect(x + 4, y, 12, 4);
  }
  // 풀밭과 땅
  g.fillStyle = '#3ccf5a'; g.fillRect(0, 66, 160, 24);
  g.fillStyle = '#8b5a2b'; g.fillRect(0, 80, 160, 10);
  g.fillStyle = '#6b421c'; for (let x = 0; x < 160; x += 16) g.fillRect(x + (Math.floor(t * 4) % 2) * 4, 84, 8, 2);
  // 폭죽
  const cols = ['#ffe033', '#ff6f0f', '#ff5a7a', '#ffffff', '#2dbe50'];
  for (let k = 0; k < 4; k++) {
    const age = ((t * 0.9 + k * 0.27) % 1), cx = 24 + k * 38, cy = 22 + (k % 2) * 12;
    for (let a = 0; a < 10; a++) {
      const ang = a / 10 * Math.PI * 2, r = age * 15;
      g.fillStyle = cols[(a + k) % cols.length];
      g.fillRect(Math.round(cx + Math.cos(ang) * r), Math.round(cy + Math.sin(ang) * r + age * age * 6), 2, 2);
    }
  }
  // 당근 더미
  [[26, 70], [34, 72], [122, 70], [130, 72], [30, 76]].forEach(([x, y]) => blit(g, SPR.carrot, x, y, 1));
  // 토끼 점프
  const hop = Math.abs(Math.sin(t * 5)) * 14;
  blit(g, SPR.rabbit, 74, 56 - hop, 1);
  blit(g, SPR.carrot, 90, 62 - hop * 0.9, 1);
  // 글자
  g.textAlign = 'center'; g.font = 'bold 14px "Courier New", monospace';
  g.fillStyle = '#1f2430'; g.fillText('GAME CLEAR!', 81, 17);
  g.fillStyle = Math.floor(t * 4) % 2 ? '#ffe033' : '#ffffff'; g.fillText('GAME CLEAR!', 80, 16);
}

function startEnding() {
  cancelAnimationFrame(endingRaf);
  endingStart = performance.now();
  jingle();
  const tick = (now) => {
    if (state !== 'clear') return;
    drawEnding((now - endingStart) / 1000);
    endingRaf = requestAnimationFrame(tick);
  };
  endingRaf = requestAnimationFrame(tick);
}

// ---------- 조작: 키보드, 아래 버튼, 끌기 ----------
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') { keys.left = true; e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'd') { keys.right = true; e.preventDefault(); }
  if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') { e.preventDefault(); start(); }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

function hold(btn, side) {
  const on = (e) => { e.preventDefault(); if (keys) keys[side] = true; btn.classList.add('on'); };
  const off = () => { if (keys) keys[side] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((t) => btn.addEventListener(t, off));
}
hold($('left'), 'left');
hold($('right'), 'right');

stage.addEventListener('pointerdown', (e) => {
  if (state !== 'play') return;
  dragX = e.clientX - stage.getBoundingClientRect().left;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', (e) => {
  if (state !== 'play' || dragX == null) return;
  dragX = e.clientX - stage.getBoundingClientRect().left;
});
['pointerup', 'pointercancel'].forEach((t) => stage.addEventListener(t, () => { dragX = null; }));

$('play').addEventListener('click', start);
$('again').addEventListener('click', start);
$('again2').addEventListener('click', start);

// ---------- 시작 ----------
showStatus();
loadPoster();
loadMusic();
resize();
reset();
draw();
</script>
</body>
</html>
