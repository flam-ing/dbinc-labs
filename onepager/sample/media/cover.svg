<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="보고서 종이, 막대 차트, 소리 물결, 재생 버튼, 체크 표시가 있는 표지 그림">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fc"/>
      <stop offset="1" stop-color="#fdf1ea"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1c2b40" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#sky)"/>
  <circle cx="1080" cy="40" r="120" fill="#ffffff" opacity="0.55"/>
  <circle cx="120" cy="280" r="90" fill="#ffffff" opacity="0.5"/>

  <!-- 보고서 종이 -->
  <g filter="url(#soft)">
    <rect x="430" y="36" width="340" height="232" rx="16" fill="#ffffff"/>
  </g>
  <rect x="462" y="62" width="150" height="12" rx="6" fill="#d9dee5"/>
  <rect x="462" y="86" width="96" height="10" rx="5" fill="#e7eaee"/>
  <line x1="462" y1="236" x2="738" y2="236" stroke="#c9ced6" stroke-width="2"/>
  <!-- 막대 7개: 위쪽만 둥글게 -->
  <g fill="#2a78d6">
    <path d="M470 236V170a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v66z"/>
    <path d="M510 236V162a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v74z"/>
    <path d="M550 236V166a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v70z"/>
    <path d="M590 236V150a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v86z"/>
    <path d="M630 236V168a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v68z"/>
    <path d="M670 236V196a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v40z"/>
    <path d="M710 236V198a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v38z"/>
  </g>

  <!-- 체크 배지 -->
  <g filter="url(#soft)">
    <circle cx="772" cy="58" r="36" fill="#eb6834"/>
  </g>
  <path d="M755 58l12 12 22-24" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 소리 물결 -->
  <g filter="url(#soft)">
    <rect x="200" y="104" width="180" height="92" rx="18" fill="#ffffff"/>
  </g>
  <g stroke="#eb6834" stroke-width="8" stroke-linecap="round">
    <line x1="232" y1="140" x2="232" y2="160"/>
    <line x1="256" y1="126" x2="256" y2="174"/>
    <line x1="280" y1="134" x2="280" y2="166"/>
    <line x1="304" y1="118" x2="304" y2="182"/>
    <line x1="328" y1="132" x2="328" y2="168"/>
    <line x1="352" y1="142" x2="352" y2="158"/>
  </g>

  <!-- 재생 버튼 -->
  <g filter="url(#soft)">
    <rect x="820" y="110" width="170" height="104" rx="18" fill="#1f2a3a"/>
  </g>
  <path d="M889 140v44l38-22z" fill="#ffffff"/>
</svg>
