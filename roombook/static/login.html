<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 회의실 예약</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>회의실 예약</h1>
    <p class="sub">DB Inc 교육용 가상 사내 툴</p>
    <p id="login-error" class="error" hidden>아이디나 비밀번호가 맞지 않아요.</p>
    <form method="post" action="/login" autocomplete="off">
      <label for="id">아이디</label>
      <input id="id" name="id" required autofocus>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">로그인</button>
    </form>
    <section class="practice">
      <h2>연습 계정</h2>
      <table>
        <tr><th>아이디</th><th>비밀번호</th><th>이름</th></tr>
        <tr><td>minji</td><td>roombook1</td><td>김민지(총무팀)</td></tr>
        <tr><td>junho</td><td>roombook2</td><td>이준호(개발팀)</td></tr>
        <tr><td>seoyeon</td><td>roombook3</td><td>박서연(인사팀)</td></tr>
      </table>
      <p>사람, 전화번호, 예약은 모두 지어낸 것이에요.</p>
    </section>
  </main>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("login-error").hidden = false;
    }
  </script>
</body>
</html>
