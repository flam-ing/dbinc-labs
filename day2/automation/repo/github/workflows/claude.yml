# 이슈 본문이나 댓글에 @claude가 있으면 Claude Code가 이 저장소에서 일해요.
# 수업용 예시예요. 실제 저장소에 쓰기 전에 강사와 같이 동작을 확인해요.
name: Claude 이슈 처리

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# 같은 이슈에서 여러 번 불러도 한 번에 하나씩만 돌게 해요.
concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 테스트 도구 설치
        run: python -m pip install -r requirements.txt

      - uses: anthropics/claude-code-action@v1
        with:
          # Claude 구독으로 만든 토큰(claude setup-token)을 저장소 시크릿에 넣어 써요.
          # API 키를 쓰면 이 줄 대신 anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }} 를 써요.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 20
            --allowedTools "Bash(python -m pytest),Bash(python -m pytest *),Bash(python tools/reproduce.py),Bash(python tools/reproduce.py *)"
