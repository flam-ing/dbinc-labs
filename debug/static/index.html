<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DB Inc 교육 방명록</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">DB INC · DAY 1</span><h1>오늘의 첫 기록.</h1><p>화면에서 보낸 한 문장이 API를 지나 데이터베이스에 남습니다.</p></header>
    <div class="layout">
      <section class="write" aria-labelledby="write-title">
        <span class="step">01 / WRITE</span><h2 id="write-title">한 줄 남기기</h2>
        <form id="entry-form">
          <label for="name">이름</label><input id="name" name="name" maxlength="40" required autocomplete="off" placeholder="실습용 별칭을 입력하세요">
          <label for="message">내용</label><textarea id="message" name="message" rows="4" maxlength="500" required placeholder="오늘 만들어보고 싶은 것을 적어보세요"></textarea>
          <button id="submit-button" type="submit">기록 저장하기 <span aria-hidden="true">↗</span></button>
          <p id="form-status" class="status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="read" aria-labelledby="list-title">
        <div class="list-heading"><div><span class="step">02 / READ</span><h2 id="list-title">우리의 기록</h2></div><button id="refresh-button" class="quiet" type="button">새로고침</button></div>
        <p id="list-status" class="status" role="status" aria-live="polite"></p><ol id="entry-list"></ol>
      </section>
    </div>
    <footer><span class="dot" aria-hidden="true"></span> 교육용 로컬 앱 · 가상 내용만 입력 · 최근 200개 표시</footer>
  </main>
</body>
</html>
